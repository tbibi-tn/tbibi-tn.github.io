          <div class="c12"><div class="chips">${[...ownDx,...topDx.filter(x=>!ownDx.includes(x))].slice(0,12).map(x=>`<button class="chip" data-dx="${esc(x)}">${esc(x)}</button>`).join("")}</div><div id="tplsug"></div></div>
          <label class="field c12"><span>${t("observations")}</span><textarea class="in" data-f="observations" style="min-height:90px">${esc(d.observations)}</textarea></label>
        </div></section>
        <section class="card" id="sec-rx"><div class="hd"><h3><span class="hi">${I("meds")}</span>${t("prescription")}</h3><div class="r">
          <select class="in" id="vtpl" style="height:30px;width:auto;font-size:12.5px"><option value="">${t("use_template")}</option>${S.templates.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
          ${vs.find(v=>(v.rx||[]).length)?`<button class="btn xs" id="vrenew">${I("repeat")}${t("renew_last")}</button>`:""}
          <button class="btn xs" id="vsavetpl" title="${t("save_template")}">${I("copy")}</button><button class="btn xs soft" id="vprx">${I("pdf")}${t("print_rx")}</button>
        </div></div><div class="bd"><input class="in" id="vmed" placeholder="${t("add_med")}"><div id="rxlist" style="margin-top:6px"></div></div></section>
        <section class="card" id="sec-exams"><div class="hd"><h3><span class="hi">${I("flask")}</span>${t("exams")}</h3></div><div class="bd">
          <div class="row" style="margin-bottom:8px"><span class="ico">${I("flask")}</span><b>${t("analyses")}</b><button class="btn xs soft right" id="pan">${I("pdf")}${t("doc_analyses")}</button></div>
          <div class="checks" id="ckan"></div><input class="in" id="anx" placeholder="${t("other_exam")}" style="margin-top:8px;max-width:340px">
          <div class="row" style="margin:18px 0 8px"><span class="ico blue">${I("scan")}</span><b>${t("imagerie")}</b><button class="btn xs soft right" id="pim">${I("pdf")}${t("doc_imagerie")}</button></div>
          <div class="checks" id="ckim"></div><input class="in" id="imx" placeholder="${t("other_exam")}" style="margin-top:8px;max-width:340px">
        </div></section>
        <section class="card" id="sec-docs"><div class="hd"><h3><span class="hi">${I("cert")}</span>${t("certificates")}</h3><span class="muted" style="font-size:12px">${t("pdf_hint")}</span></div><div class="bd"><div class="docbtns">
          ${[["repos","doc_cert_repos","cert",""],["med","doc_cert_med","file",""],["aptitude","doc_aptitude","run","blue"],["bonne","doc_bonne_sante","heart",""],["presence","doc_presence","clock","amber"],["accomp","doc_accomp","user","amber"],["permis","doc_permis","car","blue"],["lettre","doc_lettre","mail","rose"]].map(x=>`<button class="docbtn" data-doc="${x[0]}"><span class="ico ${x[3]}">${I(x[2])}</span>${t(x[1])}</button>`).join("")}
        </div></div></section>
        <section class="card" id="sec-bill"><div class="hd"><h3><span class="hi">${I("cash")}</span>${t("billing")}</h3><div class="r"><button class="btn xs" id="pnote">${I("pdf")}${t("doc_note")}</button></div></div><div class="bd form">
          <label class="field c4"><span>${t("code")}</span><select class="in" id="vcode">${S.settings.tarifs.map(x=>`<option value="${esc(x.code)}" ${x.code===d.code?"selected":""}>${esc(x.code)} — ${esc(x.label)}</option>`).join("")}</select></label>
          <label class="field c2"><span>${t("honoraires")}</span><input class="in num" id="vhon" value="${d.honoraires}" inputmode="decimal"></label>
          <label class="field c3"><span>${t("recu")}</span><div class="row" style="gap:4px"><input class="in num" id="vrecu" value="${d.recu}" inputmode="decimal"><button class="btn sm" id="vfull" title="=">${I("check")}</button><button class="btn sm" id="vzero">0</button></div></label>
          <label class="field c3"><span>${t("doctor")}</span><select class="in" id="vdoc">${S.settings.doctors.map(x=>`<option ${x===d.doctor?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
          <div class="field c12"><span>${t("bs_mode")}</span><div class="seg" id="vbs" style="align-self:flex-start">${[["sans","sans_bs"],["avec","avec_bs"],["compl","bs_compl"]].map(x=>`<button type="button" data-bs="${x[0]}" class="${d.bs===x[0]?"on":""}">${t(x[1])}</button>`).join("")}</div></div>
        </div></section>
      </div>
      <div class="ve-bar"><div class="tot" id="vtot"></div><div class="right row"><button class="btn" id="vback2">${t("cancel")}</button><button class="btn pri lg" id="vsave">${I("check")}${t("save_visit")}<kbd style="background:transparent;color:inherit;border-color:rgba(255,255,255,.35)">Ctrl S</kbd></button></div></div>
    </div>`;
    bind();
  }
  function vin(k,lab,u,ic){return`<label class="field vital" id="vw-${k}"><span>${I(ic)}${t(lab)} <small>${u}</small></span><input class="in" data-vt="${k}" value="${esc(d.vitals[k]||"")}" inputmode="decimal"></label>`}
  function drawRx(){
    const box=$("#rxlist",el);
    if(!d.rx.length){box.innerHTML=emptyState("rx",t("rx_empty"),t("rx_empty_hint"));progress();return}
    box.innerHTML=d.rx.map((r,i)=>{const m=S.meds.find(x=>x.id===r.medId)||{posologies:[]};const hit=m.nom?allergyHit(p,m):null;return`<div class="rx-line"><div class="n">${i+1}</div><div class="nm">${esc(r.nom)}${hit?` <span class="pill red">⚠ ${esc(hit)}</span>`:""}<small>${esc(m.dci||"")}${m.forme?" · "+esc(m.forme):""}</small></div>
      <div><input class="in" data-rx="${i}" data-k="posologie" value="${esc(r.posologie)}" placeholder="${t("posologie")}" style="height:32px"><div class="qchips">${(m.posologies||[]).slice(0,3).map(x=>`<button data-qp="${i}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
      <div><input class="in num" data-rx="${i}" data-k="qte" value="${r.qte||1}" title="${t("qte")}" style="height:32px;text-align:center"></div>
      <div><input class="in" data-rx="${i}" data-k="duree" value="${esc(r.duree||"")}" placeholder="${t("duree")}" style="height:32px"><div class="qchips">${["5 jours","7 jours","10 jours","1 mois","3 mois"].map(x=>`<button data-qd="${i}" data-v="${x}">${x}</button>`).join("")}</div></div>
      <button class="iconbtn" data-rm="${i}" style="width:32px;height:32px" aria-label="${t("delete")}">${I("x")}</button></div>`}).join("");
    $$("[data-rx]",box).forEach(x=>x.oninput=()=>{const r=d.rx[+x.dataset.rx];r[x.dataset.k]=x.dataset.k==="qte"?(+x.value||1):x.value});
    $$("[data-qp]",box).forEach(b=>b.onclick=()=>{d.rx[+b.dataset.qp].posologie=b.dataset.v;drawRx()});
    $$("[data-qd]",box).forEach(b=>b.onclick=()=>{d.rx[+b.dataset.qd].duree=b.dataset.v;drawRx()});
    $$("[data-rm]",box).forEach(b=>b.onclick=()=>{d.rx.splice(+b.dataset.rm,1);drawRx();totals()});
    progress();
  }
  function addMed(m){
    const push=()=>{setTimeout(totals,0);d.rx.push({medId:m.id,nom:m.nom,posologie:(m.posologies||[])[0]||"",qte:1,duree:""});drawRx();const ins=$$("#rxlist [data-k=posologie]",el);ins.length&&ins[ins.length-1].focus()};
    const hit=allergyHit(p,m);
    if(hit)confirmBox(`⚠ ${t("allergy_warn")} ${hit} — ${m.nom}. ${t("add_anyway")}`,push,{yes:t("add")});else push();
  }
  function checks(boxId,list,key){
    const all=[...new Set([...list,...d[key]])];
    $("#"+boxId,el).innerHTML=all.map(x=>`<label class="chk"><input type="checkbox" value="${esc(x)}" ${d[key].includes(x)?"checked":""}>${esc(x)}</label>`).join("");
    $$("#"+boxId+" input",el).forEach(c=>c.onchange=()=>{if(c.checked){if(!d[key].includes(c.value))d[key].push(c.value)}else d[key]=d[key].filter(x=>x!==c.value);progress()});
  }
  function progress(){
    const v=d.vitals||{},has={vitals:Object.values(v).some(x=>x!==""&&x!=null),consult:!!(d.motif||d.diagnostic),rx:d.rx.length>0,exams:d.analyses.length+d.imagerie.length>0,docs:!!VE.docDone,bill:num(d.honoraires)>0};
    Object.keys(has).forEach(k=>{const a=$("#st-"+k,el);a&&a.classList.toggle("done",has[k])});
    VIT.forEach(([k])=>{const w=$("#vw-"+k,el);w&&w.classList.toggle("warn",!!vitalWarn(k,v)&&(k!=="imc"||!!imcOf(v)))});
  }
  function totals(){
    const nv=prevSolde+num(d.honoraires)-num(d.recu);
    $("#vtot",el).innerHTML=`<span>${t("honoraires")} <b class="num">${money(d.honoraires)}</b></span><span>${t("recu")} <b class="num">${money(d.recu)}</b></span><span>${t("ancien_solde")} <b class="num">${money(prevSolde)}</b></span><span>${t("nouveau_solde")} <b class="num ${nv>0.0005?"red":"green"}" style="font-size:15px">${money(nv)} ${t("tnd")}</b></span>${d.rx.length?`<span><b>${d.rx.length}</b> ${t("search_meds").toLowerCase()}</span>`:""}`;progress();
  }
  function tplSuggest(){
    const dx=norm(d.diagnostic);const box=$("#tplsug",el);if(!dx||dx.length<3){box.innerHTML="";return}
    const tp=S.templates.find(x=>norm(x.name).includes(dx)||dx.includes(norm(x.name).split(" ")[0]));
    box.innerHTML=tp&&!d.rx.length?`<button class="btn xs" style="margin-top:8px" id="tplgo">${I("copy")}${t("use_template")} « ${esc(tp.name)} »</button>`:"";
    $("#tplgo",el)&&($("#tplgo",el).onclick=()=>{applyTpl(tp);box.innerHTML=""});
  }
  function applyTpl(tp){tp.rx.forEach(l=>{const m=S.meds.find(x=>x.id===l.medId)||{id:l.medId,nom:l.nom};const hit=m.dci?allergyHit(p,m):null;if(hit)toast("⚠ "+t("allergy_warn")+" "+hit+" — "+m.nom);d.rx.push({...l})});drawRx()}
  function bind(){
    $$("[data-vt]",el).forEach(x=>x.oninput=()=>{d.vitals[x.dataset.vt]=x.value.replace(",",".");$("#imc",el).value=imcOf(d.vitals);progress()});
    $$("[data-f]",el).forEach(x=>x.oninput=()=>{d[x.dataset.f]=x.value;if(x.dataset.f==="diagnostic")tplSuggest();progress()});
    $$("[data-dx]",el).forEach(b=>b.onclick=()=>{$("#vdx",el).value=b.dataset.dx;d.diagnostic=b.dataset.dx;tplSuggest()});
    $$("[data-sec]",el).forEach(a=>a.onclick=e=>{e.preventDefault();$("#sec-"+a.dataset.sec,el).scrollIntoView({behavior:"smooth",block:"start"})});
    $$("[data-mv]",el).forEach(x=>x.onclick=()=>openVisitView(x.dataset.mv));
    $("#vdate",el).onchange=e=>d.date=e.target.value||todayISO();
    $("#vback",el).onclick=()=>VE.close();$("#vback2",el).onclick=()=>VE.close();
    attachAC($("#vmed",el),{source:medSource,render:medRender,onPick:(it,inp)=>{inp.value="";addMed(it.m)}});
    $("#vtpl",el).onchange=e=>{const tp=S.templates.find(x=>x.id===e.target.value);if(tp)applyTpl(tp);e.target.value=""};
    $("#vrenew",el)&&($("#vrenew",el).onclick=()=>{const lv=vs.find(v=>(v.rx||[]).length);lv.rx.forEach(r=>d.rx.push({...r}));drawRx()});
    $("#vsavetpl",el).onclick=()=>{if(!d.rx.length)return;openModal(mh(t("save_template"))+`<div class="mb"><label class="field"><span>${t("template_name")}</span><input class="in" id="tn" value="${esc(d.diagnostic)}"></label></div><div class="mf"><button class="btn" data-close>${t("cancel")}</button><button class="btn pri" id="tok">${t("save")}</button></div>`,{cls:"sm",onMount:m=>m.querySelector("#tok").onclick=()=>{const n=m.querySelector("#tn").value.trim();if(!n)return;S.templates.push({id:uid("t"),name:n,rx:JSON.parse(JSON.stringify(d.rx))});save();closeModal();toast(t("saved"));draw()}})};
    checks("ckan",ANALYSES.slice(0,24),"analyses");checks("ckim",IMAGERIE.slice(0,12),"imagerie");
    const other=(id,key,box,list)=>$("#"+id,el).onkeydown=e=>{if(e.key==="Enter"&&e.target.value.trim()){e.preventDefault();d[key].push(e.target.value.trim());e.target.value="";checks(box,list,key)}};
    other("anx","analyses","ckan",ANALYSES.slice(0,24));other("imx","imagerie","ckim",IMAGERIE.slice(0,12));
    $("#pan",el).onclick=()=>d.analyses.length&&pdfExams(p,d,"analyses");
    $("#pim",el).onclick=()=>d.imagerie.length&&pdfExams(p,d,"imagerie");
    $$("[data-doc]",el).forEach(b=>b.onclick=()=>{VE.docDone=true;progress();openCert(b.dataset.doc,p,d)});
    $("#vcode",el).onchange=e=>{const tr=S.settings.tarifs.find(x=>x.code===e.target.value);d.code=e.target.value;if(tr){const full=num(d.recu)===num(d.honoraires);d.honoraires=tr.price;$("#vhon",el).value=tr.price;if(full){d.recu=tr.price;$("#vrecu",el).value=tr.price}}totals()};
    $("#vhon",el).oninput=e=>{d.honoraires=num(e.target.value);totals()};
    $("#vrecu",el).oninput=e=>{d.recu=num(e.target.value);totals()};
    $("#vfull",el).onclick=()=>{d.recu=num(d.honoraires);$("#vrecu",el).value=d.recu;totals()};
    $("#vzero",el).onclick=()=>{d.recu=0;$("#vrecu",el).value=0;totals()};
    $("#vdoc",el).onchange=e=>d.doctor=e.target.value;
    $$("#vbs button",el).forEach(b=>b.onclick=()=>{d.bs=b.dataset.bs;$$("#vbs button",el).forEach(x=>x.classList.toggle("on",x===b))});
    $("#pnote",el).onclick=()=>pdfNote(p,d);
    $("#vprx",el).onclick=()=>{if(d.rx.length)pdfRx(p,d);else $("#vmed",el).focus()};
    $("#vsave",el).onclick=saveVisit;
    drawRx();totals();tplSuggest();progress();
  }
  function saveVisit(){
    d.honoraires=num(d.honoraires);d.recu=num(d.recu);
    if(ex){Object.assign(ex,d)}else{d.id=uid("v");S.visits.push(d)}
    if(rdvId){const r=S.rdv.find(x=>x.id===rdvId);if(r)r.status="termine"}
    else{const r=S.rdv.find(x=>x.patientId===pid&&x.date===d.date&&(x.status==="arrive"||x.status==="encours"||x.status==="prevu"));if(r)r.status="termine"}
    if(S.draft&&S.draft.pid===pid)delete S.draft;
    save();teardown();toast(t("visit_saved"));
    if(UI.route[0]==="patient"&&UI.route[1]===pid)render();else go("patient/"+pid);
  }
  draw();
}

/* ---------- certificates modal ---------- */
function openCert(type,p,d){
  const today=todayISO();
  const F={
    repos:`<label class="field c4"><span>${t("cert_days")}</span><input class="in" id="cd" type="number" min="1" value="3"></label><label class="field c8"><span>${t("cert_from")}</span><input class="in" id="cf" type="date" value="${today}"></label>`,
    med:`<label class="field c12"><span>${t("cert_text")}</span><textarea class="in" id="ct" style="min-height:120px">certifie avoir examiné ce jour ${fullName(p)} et constaté : </textarea></label>`,
    aptitude:`<label class="field c8"><span>${t("cert_sport")}</span><input class="in" id="cs" value="Football"></label><label class="field c4"><span>&nbsp;</span><select class="in" id="cc"><option>en compétition</option><option>en loisir</option><option>scolaire</option></select></label>`,
    bonne:"",
    presence:`<label class="field c6"><span>${t("rdv_time")}</span><input class="in" id="ch1" type="time" value="${d.time||nowHM()}"></label><label class="field c6"><span>→</span><input class="in" id="ch2" type="time" value="${nowHM()}"></label>`,
    accomp:`<label class="field c12"><span>${t("cert_accomp_name")}</span><input class="in" id="ca"></label>`,
    permis:`<label class="field c12"><span>Catégorie</span><select class="in" id="cp"><option>B</option><option>A</option><option>A1</option><option>C</option><option>D</option><option>B+E</option><option>C+E</option></select></label>`,
    lettre:`<label class="field c6"><span>${t("lettre_to")}</span><input class="in" id="lt" placeholder="Dr …"></label><label class="field c6"><span>${t("lettre_spe")}</span><input class="in" id="ls" placeholder="Cardiologue"></label><label class="field c12"><span>${t("lettre_body")}</span><textarea class="in" id="lb" style="min-height:110px">Je vous adresse ${fullName(p)}, âgé(e) de ${ageStr(p.dob)}, pour avis et prise en charge.\n\nMotif : ${d.motif||""}\nDiagnostic évoqué : ${d.diagnostic||""}</textarea></label>`,
  };
  const names={repos:"doc_cert_repos",med:"doc_cert_med",aptitude:"doc_aptitude",bonne:"doc_bonne_sante",presence:"doc_presence",accomp:"doc_accomp",permis:"doc_permis",lettre:"doc_lettre"};
  openModal(mh(t(names[type]),"","cert")+`<div class="mb form">${F[type]||""}<div class="c12 muted" style="font-size:12.5px">${esc(fullName(p))} · ${fmtD(d.date)}</div></div><div class="mf"><button class="btn" data-close>${t("cancel")}</button><button class="btn pri" id="cgo">${I("pdf")}${t("generate")}</button></div>`,{cls:"sm",onMount:m=>{
    const g=id=>{const x=m.querySelector("#"+id);return x?x.value:""};
    m.querySelector("#cgo").onclick=()=>{pdfCert(type,p,d,{days:g("cd"),from:g("cf"),text:g("ct"),sport:g("cs"),cadre:g("cc"),h1:g("ch1"),h2:g("ch2"),acc:g("ca"),cat:g("cp"),to:g("lt"),spe:g("ls"),body:g("lb")});closeModal()};
  }});
}

  .sheet>.wm{position:absolute;left:50%;top:54%;width:${A5?"95mm":"130mm"};height:${A5?"95mm":"130mm"};transform:translate(-50%,-50%);opacity:.032;pointer-events:none;z-index:0}
  .sheet>*{position:relative;z-index:1}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:${A5?"7mm":"9mm"} 0 ${A5?"4mm":"5mm"};border-bottom:1px solid #cfe3da}
  .id{display:flex;gap:11px;align-items:center}
  .logo{width:${A5?"38px":"44px"};height:${A5?"38px":"44px"};border-radius:10px;background:#0f7b5f;display:flex;align-items:center;justify-content:center;flex:none}

  .ttl .k{font-size:.9em;color:#62736d;margin-bottom:3px}
  .ttl .rxs{font-family:Georgia,serif;font-size:${A5?"34px":"40px"};line-height:.8;color:#0f7b5f;font-style:italic}
  .ttl .dt{text-align:right;color:#3e544c;font-size:.95em}
  .pt{display:flex;flex-wrap:wrap;gap:4px 22px;background:#eef7f3;border-left:3px solid #0f7b5f;border-radius:0 7px 7px 0;padding:7px 12px;margin-bottom:${A5?"5mm":"6mm"}}
  .pt div{min-width:0}.pt .l{font-size:.78em;color:#5c7a70}.pt .v{font-weight:600;color:#0d2a21}
  .pt .al{color:#b4342a}

const toMin=hm=>{const[h,m]=(hm||"0:0").split(":").map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+":"+pad(m%60);
function weekStart(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return isoDate(d)}
function vAgenda(pg){
  const A=S.settings.agenda,slot=+A.slot||30,st=toMin(A.start),en=toMin(A.end),H=Math.round(46*slot/30);
  const ws=weekStart(UI.wkOffset),allDays=[0,1,2,3,4,5].map(i=>addDays(ws,i)),td=todayISO();
  const mobile=matchMedia("(max-width:820px)").matches;
  if(UI.agDay==null||UI.agDay>5)UI.agDay=Math.max(0,allDays.indexOf(td));
  const days=mobile?[allDays[UI.agDay]]:allDays;
  const nslots=Math.ceil((en-st)/slot);
  const wkRdv=S.rdv.filter(r=>r.date>=allDays[0]&&r.date<=allDays[5]);
  const lbl=d=>new Date(d+"T00:00:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});
  pg.innerHTML=`
  <div class="ph"><div><h1>${t("nav_agenda")}</h1><div class="sub">${t("agenda_sub")}</div></div>
   <div class="actions"><button class="btn pri" data-act="agNew">${I("plus")}${t("new_rdv")}</button></div></div>
  <div class="card"><div class="toolbar"><button class="iconbtn" data-act="agPrev">${I("left")}</button><button class="btn sm" data-act="agToday">${t("today_btn")}</button><button class="iconbtn" data-act="agNext">${I("right")}</button>
   <b style="margin-left:6px">${new Date(allDays[0]+"T00:00:00").toLocaleDateString(loc(),{day:"numeric",month:"long"})} – ${new Date(allDays[5]+"T00:00:00").toLocaleDateString(loc(),{day:"numeric",month:"long",year:"numeric"})}</b>
   <div class="right row wrap">${["prevu","arrive","encours","termine","absent"].map(s=>`<span class="muted" style="font-size:12px">${stPill(s)} ${wkRdv.filter(r=>r.status===s).length}</span>`).join("")}</div></div>
   ${mobile?`<div class="chips daychips">${allDays.map((d,i)=>`<button class="chip ${i===UI.agDay?"on":""}" data-agday="${i}">${new Date(d+"T00:00:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric"})}<span class="n">${S.rdv.filter(r=>r.date===d&&r.status!=="absent").length}</span></button>`).join("")}</div>`:""}
   <div class="ag-wrap"><div class="ag ${mobile?"one":""}" style="grid-template-columns:${mobile?"52px":"60px"} repeat(${days.length},minmax(0,1fr))">
    <div class="hcell"></div>${days.map(d=>`<div class="hcell ${d===td?"today":""}" style="text-transform:capitalize">${lbl(d)} <span style="opacity:.6;font-weight:500">· ${S.rdv.filter(r=>r.date===d&&r.status!=="absent").length}</span></div>`).join("")}
    <div>${Array.from({length:nslots},(_,i)=>`<div style="height:${H}px" class="tcell">${(st+i*slot)%60===0||slot<60?fromMin(st+i*slot):""}</div>`).join("")}</div>
    ${days.map(d=>{
      const evs=S.rdv.filter(r=>r.date===d).sort((a,b)=>a.time.localeCompare(b.time));
      const cols={};evs.forEach(r=>{cols[r.time]=(cols[r.time]||0)+1});const idx={};
      let now="";if(d===td){const nm=toMin(nowHM());if(nm>=st&&nm<=en)now=`<div class="nowline" style="top:${(nm-st)/slot*H}px"></div>`}
      return`<div class="col ${d===td?"today":""}" data-day="${d}">${Array.from({length:nslots},(_,i)=>`<div class="slot ${(st+(i+1)*slot)%60!==0?"half":""}" style="height:${H}px" data-t="${fromMin(st+i*slot)}"></div>`).join("")}${now}
      ${evs.map(r=>{const p=r.patientId?P(r.patientId):null;const n=cols[r.time],k=idx[r.time]=(idx[r.time]||0)+1;const top=(toMin(r.time)-st)/slot*H,h=Math.max((+r.duration||slot)/slot*H-3,22);
        return`<div class="ev-blk st-${r.status}" data-r="${r.id}" style="top:${top+1}px;height:${h}px;left:calc(${(k-1)*100/n}% + 3px);right:auto;width:calc(${100/n}% - 6px)"><b>${r.time} ${esc(p?shortName(p):r.name)}</b><span>${esc(r.motif||t("st_"+r.status))}</span></div>`}).join("")}</div>`}).join("")}
   </div></div></div>`;
  ACT.agPrev=()=>{UI.wkOffset--;render()};ACT.agNext=()=>{UI.wkOffset++;render()};ACT.agToday=()=>{UI.wkOffset=0;UI.agDay=null;render()};
  $$("[data-agday]").forEach(b=>b.onclick=()=>{UI.agDay=+b.dataset.agday;render()});
  ACT.agNew=()=>openRdvForm(null,{date:UI.wkOffset===0?td:days[0]});
  $$(".ag .slot").forEach(s=>s.onclick=()=>openRdvForm(null,{date:s.parentElement.dataset.day,time:s.dataset.t}));
  $$(".ev-blk").forEach(b=>b.onclick=e=>{e.stopPropagation();openRdvForm(b.dataset.r)});
  const nl=$(".nowline");if(nl)setTimeout(()=>{const w=$(".ag-wrap");},0);
}
function openRdvForm(id,{date,time,patientId}={}){

/* ---- src/js/ui/charts.js ---- */
/* =========================================================
   CHARTS — small SVG chart engine, no library
   Charts are drawn at their real pixel width (text never
   scales), redrawn on resize, with a hover tooltip and a
   table view for every chart.
   Series colors: --s1 (green), --s2 (blue), validated for
   colour-blind separation in light and dark mode.
   ========================================================= */
const VIZ={reg:{},seq:0,ro:null};
const vizId=cfg=>{const id="v"+(++VIZ.seq);VIZ.reg[id]=cfg;return id};
const compact=n=>{const a=Math.abs(n);if(a>=1e6)return(n/1e6).toLocaleString(loc(),{maximumFractionDigits:1})+"M";if(a>=1e4)return(n/1e3).toLocaleString(loc(),{maximumFractionDigits:1})+"K";return Math.round(n).toLocaleString(loc())};
function niceTicks(max,count=4){
  if(max<=0)return[0,1];const raw=max/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;const top=Math.ceil(max/step)*step;
  const r=[];for(let v=0;v<=top+step/2;v+=step)r.push(+v.toFixed(6));return r;
}
const textW=(s,px=11)=>String(s).length*px*0.6;

/* placeholder; the chart is drawn by mountViz once the element has a size */
function vizBox(cfg){const id=vizId(cfg);return`<div class="viz" data-viz="${id}" style="height:${cfg.h||240}px" role="img" aria-label="${esc(cfg.title||"")}"></div>`}
function vizCard({title,icon,sub,cfg,cls="",extra=""}){
  const id=vizId(cfg);
  return`<div class="card ${cls}"><div class="hd"><h3><span class="hi">${I(icon)}</span><span>${title}${sub?`<small class="hsub">${sub}</small>`:""}</span></h3><div class="r">${extra}${cfg.table?`<button class="btn xs ghost" data-vtab="${id}" aria-pressed="false">${I("csv")}${t("s_table")}</button>`:""}</div></div>
   ${cfg.legend?`<div class="legend vlegend">${cfg.legend.map(l=>`<span><i style="background:var(${l.c})"></i>${esc(l.n)}</span>`).join("")}</div>`:""}
   <div class="bd chart"><div class="viz" data-viz="${id}" style="height:${cfg.h||240}px" role="img" aria-label="${esc(title)}"></div><div class="vtable" id="vt-${id}" hidden></div></div></div>`;
}
function mountViz(root=document){
  if(!VIZ.ro&&window.ResizeObserver)VIZ.ro=new ResizeObserver(es=>es.forEach(e=>{const el=e.target;if(el.isConnected&&Math.abs((el._w||0)-el.clientWidth)>4)drawViz(el)}));
  $$(".viz[data-viz]",root).forEach(el=>{drawViz(el);VIZ.ro&&VIZ.ro.observe(el)});
  $$("[data-vtab]",root).forEach(b=>b.onclick=()=>{const id=b.dataset.vtab,cfg=VIZ.reg[id],box=$("#vt-"+id),viz=$(`.viz[data-viz="${id}"]`);const on=box.hidden;
    if(on&&!box.innerHTML)box.innerHTML=`<div class="tablewrap" style="max-height:320px"><table class="t"><thead><tr>${cfg.table.head.map((h,i)=>`<th class="${i?"num":""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${cfg.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?"num":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    box.hidden=!on;viz.hidden=on;b.setAttribute("aria-pressed",String(on));b.classList.toggle("on",on)});
  bindChartTips(root);
}
function drawViz(el){const cfg=VIZ.reg[el.dataset.viz];if(!cfg)return;const w=el.clientWidth||600;el._w=w;
  el.innerHTML=({bars:svgBars,line:svgLine,heat:svgHeat}[cfg.type])(cfg,w);
  if(cfg.type!=="heat")bindHover(el,cfg)}

/* ---------- stacked / single columns ---------- */
function svgBars(c,W){
  const H=c.h||240,n=c.labels.length,tot=c.labels.map((_,i)=>c.series.reduce((s,x)=>s+(x.values[i]||0),0));
  const ticks=niceTicks(Math.max(...tot,0)),top=ticks[ticks.length-1]||1;
  const ml=Math.max(...ticks.map(v=>textW(compact(v))))+12,mr=8,mt=18,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  const band=pw/n,bw=Math.max(2,Math.min(24,band*0.62)),Y=v=>mt+ph*(1-v/top);
  let g=ticks.map(v=>`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`).join("");
  const every=Math.max(1,Math.ceil(n*Math.max(...c.labels.map(l=>textW(l)))/(pw*0.8)));
  const hiI=tot.indexOf(Math.max(...tot));
  let marks="";
  c.labels.forEach((l,i)=>{const x=ml+band*i+(band-bw)/2;let y0=Y(0);const segs=c.series.map((s,k)=>({v:s.values[i]||0,k})).filter(s=>s.v>0);
    segs.forEach((s,j)=>{const h=Y(0)-Y(s.v),isTop=j===segs.length-1,y=y0-h,yt=isTop?y:Math.min(y0,y+2);const r=isTop?Math.min(4,y0-yt,bw/2):0;
      marks+=`<path class="m" style="fill:var(${c.series[s.k].c})" d="M${x},${y0}V${yt+r}${r?`Q${x},${yt} ${x+r},${yt}H${x+bw-r}Q${x+bw},${yt} ${x+bw},${yt+r}`:`H${x+bw}`}V${y0}Z"/>`;
      y0=y;});
    if(c.labelMax&&i===hiI&&tot[i]>0)marks+=`<text class="vlab" x="${x+bw/2}" y="${Y(tot[i])-6}" text-anchor="middle">${esc(c.fmt?c.fmt(tot[i]):compact(tot[i]))}</text>`;
    if(i%every===0)marks+=`<text x="${ml+band*i+band/2}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;
  });
  const hits=c.labels.map((_,i)=>`<rect class="hit" data-i="${i}" x="${ml+band*i}" y="${mt}" width="${band}" height="${ph}"/>`).join("");
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect class="band" x="0" y="${mt}" width="${band}" height="${ph}" visibility="hidden"/>${g}<line class="axis" x1="${ml}" x2="${W-mr}" y1="${Y(0)}" y2="${Y(0)}"/>${marks}${hits}</svg>`;
}
/* ---------- lines (+ area for a single series) ---------- */
function svgLine(c,W){
  const H=c.h||220,n=c.labels.length;const all=c.series.flatMap(s=>s.values.filter(v=>v!=null));
  if(!all.length)return emptyState("chart",t("no_data"),c.empty||"");
  let lo=c.zero?0:Math.min(...all),hi=Math.max(...all);if(!c.zero){const p=(hi-lo)*.2||1;lo=Math.max(0,lo-p);hi+=p}
  const ticks=c.zero?niceTicks(hi):(()=>{const r=[],st=(hi-lo)/3;for(let i=0;i<=3;i++)r.push(lo+st*i);return r})();
  const tlo=ticks[0],thi=ticks[ticks.length-1]||1,dec=c.dec||0,fmtT=v=>c.zero?compact(v):v.toFixed(dec);
  const ml=Math.max(...ticks.map(v=>textW(fmtT(v))))+12,mr=c.endLabel?44:14,mt=16,mb=26,pw=W-ml-mr,ph=H-mt-mb;
  const X=i=>n===1?ml+pw/2:ml+pw*i/(n-1),Y=v=>mt+ph*(1-(v-tlo)/(thi-tlo||1));
  let g=ticks.map(v=>`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${fmtT(v)}</text>`).join("");
  const every=Math.max(1,Math.ceil(n*Math.max(...c.labels.map(l=>textW(l)))/(pw*0.8)));
  const lw=Math.max(...c.labels.map(l=>textW(l)))+10;let lastX=-1e9;
  c.labels.forEach((l,i)=>{const x=Math.min(Math.max(X(i),ml+textW(l)/2),W-4-textW(l)/2);if((i%every===0||i===n-1)&&x-lastX>=lw){g+=`<text x="${x}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`;lastX=x}});
  let marks="";
  c.series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
    if(c.series.length===1&&pts.length>1)marks+=`<path class="area" style="fill:var(${s.c})" d="${d}L${pts[pts.length-1][0]} ${Y(tlo)}L${pts[0][0]} ${Y(tlo)}Z"/>`;
    marks+=`<path class="ln" style="stroke:var(${s.c})${s.dash?";stroke-dasharray:5 4":""}" d="${d}"/>`;
    if(pts.length<=24)pts.forEach(p=>marks+=`<circle class="dot" style="fill:var(${s.c})" r="4" cx="${p[0]}" cy="${p[1]}"/>`);
    else{const p=pts[pts.length-1];marks+=`<circle class="dot" style="fill:var(${s.c})" r="4" cx="${p[0]}" cy="${p[1]}"/>`}
    if(c.endLabel){const li=s.values.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();marks+=`<text class="vlab" x="${X(li)+8}" y="${Y(s.values[li])+4}">${esc(c.fmt?c.fmt(s.values[li]):compact(s.values[li]))}</text>`}
  });
  const step=n>1?pw/(n-1):pw;
  const hits=c.labels.map((_,i)=>`<rect class="hit" data-i="${i}" x="${X(i)-step/2}" y="${mt}" width="${step}" height="${ph}"/>`).join("");
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}<line class="cross" x1="0" x2="0" y1="${mt}" y2="${mt+ph}" visibility="hidden"/>${marks}${hits}</svg>`;
}
/* ---------- heatmap (weekday × hour) ---------- */
function svgHeat(c,W){
  const rows=c.rows.length,cols=c.cols.length,ml=48,mt=8,mb=24,H=c.h||220;
  const cw=Math.max(14,(W-ml-4)/cols),ch=Math.min(32,(H-mt-mb)/rows),mx=Math.max(1,...c.values.flat());
  let s="";
  c.values.forEach((row,r)=>{s+=`<text x="${ml-8}" y="${mt+ch*r+ch/2+4}" text-anchor="end">${esc(c.rows[r])}</text>`;
    row.forEach((v,k)=>{const pct=v?Math.round(14+86*v/mx):0;
      s+=`<rect class="cell" x="${ml+cw*k+1}" y="${mt+ch*r+1}" width="${cw-2}" height="${ch-2}" rx="4" style="fill:${v?`color-mix(in srgb,var(--s1) ${pct}%,var(--surface))`:"var(--soft)"}" data-tip="${esc(c.rows[r]+" "+c.cols[k]+" : "+v+" "+c.unit)}"/>`})});
  const every=Math.max(1,Math.ceil(cols*28/(W-ml)));
  c.cols.forEach((l,k)=>{if(k%every===0)s+=`<text x="${ml+cw*k+cw/2}" y="${mt+ch*rows+16}" text-anchor="middle">${esc(l)}</text>`});
  return`<svg width="${W}" height="${mt+ch*rows+mb}" viewBox="0 0 ${W} ${mt+ch*rows+mb}">${s}</svg>`;
}
/* ---------- hover tooltip with crosshair / band ---------- */
function bindHover(el,c){
  const svg=$("svg",el);if(!svg)return;const band=$(".band",svg),cross=$(".cross",svg);
  $$(".hit",svg).forEach(r=>{
    r.addEventListener("mousemove",e=>{const i=+r.dataset.i;
      if(band){band.setAttribute("x",r.getAttribute("x"));band.setAttribute("width",r.getAttribute("width"));band.setAttribute("visibility","visible")}
      if(cross){const x=+r.getAttribute("x")+ +r.getAttribute("width")/2;cross.setAttribute("x1",x);cross.setAttribute("x2",x);cross.setAttribute("visibility","visible")}
      const rows=c.series.filter(s=>s.values[i]!=null).map(s=>`<div class="trow"><i style="background:var(${s.c})"></i><span>${esc(s.name||"")}</span><b>${esc(c.fmt?c.fmt(s.values[i]):compact(s.values[i]))}</b></div>`).join("");
      const tot=c.type==="bars"&&c.series.length>1?`<div class="trow tot"><span>${t("total")}</span><b>${esc(c.fmt?c.fmt(c.series.reduce((a,s)=>a+(s.values[i]||0),0)):"")}</b></div>`:"";
      showTip(e,`<div class="tt">${esc(c.tipLabels?c.tipLabels[i]:c.labels[i])}</div>${rows}${tot}`)});
    r.addEventListener("mouseleave",()=>{hideTip();band&&band.setAttribute("visibility","hidden");cross&&cross.setAttribute("visibility","hidden")});
  });
}
let TIP=null;
function showTip(e,html){if(!TIP){TIP=document.createElement("div");TIP.className="tip";document.body.appendChild(TIP)}TIP.innerHTML=html;
  const w=TIP.offsetWidth,h=TIP.offsetHeight;let x=e.clientX+14,y=e.clientY-h-10;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+16;TIP.style.left=x+"px";TIP.style.top=y+"px"}
function hideTip(){if(TIP){TIP.remove();TIP=null}}
function bindChartTips(root){
  $$("[data-tip]",root).forEach(el=>{if(el._tip)return;el._tip=1;el.addEventListener("mousemove",e=>showTip(e,esc(el.dataset.tip)));el.addEventListener("mouseleave",hideTip)});

/* ---------- HTML pieces ---------- */
function hbars(rows,fmt=v=>v){const mx=Math.max(...rows.map(r=>r.v),1);return rows.length?`<div class="hbars">${rows.map(r=>`<div class="hbar" data-tip="${esc(r.l)} : ${esc(fmt(r.v))}"><div class="lb" title="${esc(r.l)}">${esc(r.l)}</div><div class="tr"><i style="width:${Math.max(1,r.v/mx*100)}%"></i></div><div class="vl">${esc(fmt(r.v))}</div></div>`).join("")}</div>`:emptyState("chart",t("no_data"),"")}
function sparkline(vals,{w=88,h=28}={}){if(!vals.length||vals.every(v=>!v))return"";const mx=Math.max(...vals),mn=Math.min(...vals),X=i=>2+(w-6)*i/(vals.length-1||1),Y=v=>h-3-(h-6)*((v-mn)/((mx-mn)||1));
  const d=vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join("");return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle r="3" cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}"/></svg>`}
/* one whole split into parts (tall segmented bar) */
function segBar(parts,fmt=v=>v){const tot=parts.reduce((s,p)=>s+p.v,0)||1;
  return`<div class="segbar" role="img" aria-label="${esc(parts.map(p=>p.n+" "+Math.round(p.v/tot*100)+"%").join(", "))}">${parts.filter(p=>p.v>0).map(p=>{const pc=p.v/tot*100;return`<div style="flex:${p.v};background:var(${p.c})" data-tip="${esc(p.n)} : ${esc(fmt(p.v))} (${Math.round(pc)} %)">${pc>=14?`<span>${Math.round(pc)} %</span>`:""}</div>`}).join("")}</div>
  <div class="legend" style="margin-top:10px">${parts.map(p=>`<span><i style="background:var(${p.c})"></i>${esc(p.n)} <b>${esc(fmt(p.v))}</b></span>`).join("")}</div>`}

/* [from,to] of the selected period and of the period just before it */
function statsRange(per,td){
  const y=+td.slice(0,4),m=+td.slice(5,7),d=+td.slice(8,10);
  if(per==="month"){const from=td.slice(0,8)+"01";const pm=new Date(y,m-2,1),pe=new Date(y,m-2,Math.min(d,new Date(y,m-1,0).getDate()));return{from,to:td,pfrom:isoDate(pm),pto:isoDate(pe),vs:t("s_vs_month")}}
  if(per==="d30")return{from:addDays(td,-29),to:td,pfrom:addDays(td,-59),pto:addDays(td,-30),vs:t("s_vs_30")};
  if(per==="year")return{from:y+"-01-01",to:td,pfrom:(y-1)+"-01-01",pto:(y-1)+td.slice(4),vs:t("s_vs_year")};
  return{from:"0000",to:td,pfrom:null,pto:null,vs:""};
}
function statsFigures(from,to){
  const vs=S.visits.filter(v=>v.date>=from&&v.date<=to);
  const ca=vs.reduce((s,v)=>s+num(v.honoraires),0),recu=vs.reduce((s,v)=>s+num(v.recu),0);
  const pay=S.payments.filter(x=>x.date>=from&&x.date<=to).reduce((s,x)=>s+num(x.amount),0);
  return{vs,n:vs.length,ca,rc:recu+pay,unpaid:ca-recu,avg:vs.length?ca/vs.length:0,coll:ca?Math.min(100,(recu+pay)/ca*100):0,newP:S.patients.filter(p=>p.createdAt>=from&&p.createdAt<=to).length};
}
function kpiTile({l,v,unit="",icon,cur,prev,goodUp=true,spark,neg=false,vsLabel}){
  let delta="";
  if(prev!=null&&isFinite(prev)){
    if(prev===0&&cur===0)delta=`<span class="delta flat">— ${esc(vsLabel)}</span>`;
    else if(prev===0)delta=`<span class="delta up good">${I("up")}${t("s_new")} ${esc(vsLabel)}</span>`;
    else{const pc=Math.round((cur-prev)/Math.abs(prev)*100),up=pc>0,good=pc===0?null:(up===goodUp);
      delta=`<span class="delta ${pc===0?"flat":up?"up":"down"} ${good===null?"":good?"good":"bad"}">${pc===0?"=":I(up?"up":"down")}${Math.abs(pc)} % <span class="muted">${esc(vsLabel)}</span></span>`}
  }
  return`<div class="card kpi stat ${neg?"neg":""}"><div class="ki">${I(icon)}</div><div style="min-width:0;flex:1"><div class="l">${l}</div><div class="v">${v}${unit?`<small>${unit}</small>`:""}</div>${delta}</div>${spark||""}</div>`;
}

  /* visits per month, always the last 12 months */

    <div class="card"><div class="hd"><h3><span class="hi">${I("agenda")}</span>${t("set_agenda")}</h3></div><div class="bd form">${f("c4","set_start","as",A.start,"time")}${f("c4","set_end","ae",A.end,"time")}<label class="field c4"><span>${t("set_slot")}</span><select class="in" id="asl">${[15,20,30,60].map(x=>`<option ${+A.slot===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="field c12"><span>${t("set_doctors")}</span><textarea class="in" id="sdocs" style="min-height:60px">${esc(S.settings.doctors.join("\n"))}</textarea></label></div></div>
    <div class="card"><div class="hd"><h3><span class="hi">${I("qr")}</span>${t("set_queue")}</h3></div><div class="bd form">
      <label class="field c6"><span>${t("set_consult_min")}</span><select class="in" id="qmin"><option value="0">${t("set_auto_min").replace("{m}",autoConsultMin())}</option>${[5,8,10,12,15,20,25,30,40,45].map(x=>`<option value="${x}" ${+S.settings.consultMin===x?"selected":""}>${x} min</option>`).join("")}</select></label>
      <label class="field c6"><span>${t("set_screen_names")}</span><select class="in" id="qnames"><option value="numbers">${t("set_names_numbers")}</option><option value="initials" ${S.settings.screenNames==="initials"?"selected":""}>${t("set_names_initials")}</option></select></label>
      <label class="field c12"><span>${t("set_queue_url")}</span><input class="in" id="qurl" type="url" placeholder="https://votre-nom.github.io/tbibi/attente/" value="${esc(S.settings.queueUrl||"")}"></label>
      <p class="c12 muted" style="margin:-4px 0 0;font-size:12.5px">${t("set_queue_url_hint")}</p>
      <label class="chk c12" style="padding-left:0"><input type="checkbox" id="qauto" ${S.settings.autoTicket?"checked":""}>${t("set_auto_ticket")}</label>
      <div class="c12 row wrap"><button class="btn soft" data-act="openScreen">${I("tv")}${t("q_screen")}</button><button class="btn" data-act="qTest">${I("qr")}${t("set_queue_test")}</button></div>
    </div></div>
    <div class="card"><div class="hd"><h3><span class="hi">${I("lock")}</span>${t("set_security")}</h3><div class="r">${encrypted()?`<span class="pill green">${I("shield")}${t("sec_on")}</span>`:`<span class="pill amber">${I("alert")}${t("sec_off")}</span>`}</div></div><div class="bd">
      ${encrypted()?`<p class="muted" style="margin:0 0 12px">${t("sec_on_text")}</p>
       <div class="form"><label class="field c6"><span>${t("sec_autolock")}</span><select class="in" id="alk">${[0,5,10,15,30,60].map(x=>`<option value="${x}" ${+(S.settings.autolock??10)===x?"selected":""}>${x?x+" min":t("sec_never")}</option>`).join("")}</select></label>
       <div class="c6 row" style="align-self:end"><button class="btn" data-act="secLock">${I("lock")}${t("lock")}</button></div></div>
       <div class="row wrap mt"><button class="btn" data-act="secChange">${I("edit")}${t("sec_change")}</button><button class="btn ghost danger right" data-act="secOff">${t("sec_disable")}</button></div>`
      :`<p class="muted" style="margin:0 0 12px">${t("sec_off_text")}</p><button class="btn pri" data-act="secOn">${I("lock")}${t("sec_enable")}</button>`}
      ${cryptoOK()?"":`<div class="alert mt">${I("alert")}<div>${t("sec_unsupported")}</div></div>`}
    </div></div>
   </div>
   <div class="card" style="grid-column:1/-1"><div class="hd"><h3><span class="hi">${I("download")}</span>${t("set_backup")}</h3></div><div class="bd"><p class="muted" style="margin-top:0">${t("set_backup_hint")} — ${S.patients.length} ${t("nav_patients").toLowerCase()}, ${S.visits.length} ${t("k_consult").toLowerCase()}.</p>
    <div class="storebar" id="stor"></div>
    <div class="row wrap"><button class="btn pri" data-act="bkExport">${I("download")}${t("set_export")}</button><label class="btn">${I("upload")}${t("set_import")}<input type="file" id="bkfile" accept=".tbibi,.json,application/json" hidden></label><span class="right"></span><button class="btn" data-act="bkDemo">${t("set_reset")}</button><button class="btn danger" data-act="bkWipe">${I("trash")}${t("set_wipe")}</button></div>
    <div class="muted mt" style="font-size:12.5px">${t("shortcuts")} : <kbd>Ctrl K</kbd> / <kbd>/</kbd> ${t("sc_search")} · <kbd>Alt N</kbd> ${t("sc_new")} · <kbd>Ctrl S</kbd> ${t("save_visit")} · <kbd>Esc</kbd> ${t("close")}<span class="right" style="float:right">${APP} v${typeof APP_VERSION!=="undefined"?APP_VERSION:"dev"}</span></div></div></div>
  </div>`;
  const tarifs=JSON.parse(JSON.stringify(S.settings.tarifs));
  function drawT(){$("#ttb").innerHTML=tarifs.map((x,i)=>`<tr><td style="width:90px"><input class="in" data-ti="${i}" data-k="code" value="${esc(x.code)}" style="height:30px"></td><td><input class="in" data-ti="${i}" data-k="label" value="${esc(x.label)}" style="height:30px"></td><td style="width:110px"><input class="in num" data-ti="${i}" data-k="price" value="${x.price}" style="height:30px;text-align:right"></td><td style="width:44px"><button class="iconbtn" data-tr="${i}" style="width:30px;height:30px">${I("x")}</button></td></tr>`).join("");
    $$("[data-ti]").forEach(x=>x.oninput=()=>tarifs[+x.dataset.ti][x.dataset.k]=x.dataset.k==="price"?num(x.value):x.value);
    $$("[data-tr]").forEach(x=>x.onclick=()=>{tarifs.splice(+x.dataset.tr,1);drawT()})}
  drawT();$("#tadd").onclick=()=>{tarifs.push({code:"",label:"",price:0});drawT()};
  const collect=()=>{const g=id=>$("#"+id).value.trim();
    Object.assign(S.settings.doctor,{name:g("sn"),spe:g("ss"),addr:g("sa"),city:g("sc"),phone:g("sp"),email:g("se"),cnam:g("scn"),mf:g("smf"),hours:g("sh")});
    S.settings.tarifs=tarifs.filter(x=>x.code);S.settings.agenda={start:g("as")||"08:00",end:g("ae")||"18:00",slot:+g("asl")||30};
    S.settings.doctors=g("sdocs").split("\n").map(x=>x.trim()).filter(Boolean);if(!S.settings.doctors.length)S.settings.doctors=[S.settings.doctor.name];
    if($("#alk"))S.settings.autolock=+$("#alk").value;
    S.settings.doctor.autoStamp=$("#sauto").checked;
    S.settings.consultMin=+$("#qmin").value;S.settings.screenNames=$("#qnames").value;S.settings.queueUrl=$("#qurl").value.trim();S.settings.autoTicket=$("#qauto").checked;};
  ACT.openScreen=()=>openWaitingScreen();
  ACT.qTest=()=>{collect();save();const url=patientPageUrl(queueSnapshot(todayQueue().waiting[0]&&todayQueue().waiting[0].ticket));
    openModal(mh(t("set_queue_test"),"","qr")+`<div class="mb" style="text-align:center"><div style="width:220px;margin:0 auto">${qrSvg(url,{ecl:"L",border:2})}</div><p class="muted" style="font-size:12.5px;word-break:break-all;margin:12px 0 0">${esc(url.length>110?url.slice(0,110)+"…":url)}</p></div><div class="mf"><a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener">${I("right")}${t("set_queue_open")}</a></div>`,{cls:"sm"})};
  /* every change is saved right away */
  let asvT;pg.addEventListener("change",e=>{if(e.target.type==="file"||e.target.id==="bkfile")return;collect();save();const a=$("#asv");if(a){a.classList.add("on");clearTimeout(asvT);asvT=setTimeout(()=>a.classList.remove("on"),1800)}});
  const pickImg=(inputId,key,maxW,maxH)=>{$("#"+inputId).onchange=async e=>{const f=e.target.files[0];if(!f)return;
    if(f.size>8*1024*1024){toast(t("set_img_big"),true);return}
    try{S.settings.doctor[key]=await shrinkImage(f,maxW,maxH);save();toast(t("saved"));render()}catch(err){toast(t("set_img_err"),true)}}};
  pickImg("lgf","logo",600,240);pickImg("stf","stamp",700,420);
  $("#lgx")&&($("#lgx").onclick=()=>{delete S.settings.doctor.logo;save();render()});
  $("#stx")&&($("#stx").onclick=()=>{delete S.settings.doctor.stamp;save();render()});
  storageUsage().then(async u=>{const el=$("#stor");if(!el)return;const pers=await storagePersisted();
    const mb=x=>(x/1048576).toFixed(x<10485760?1:0);
    el.innerHTML=u?`<div class="row" style="justify-content:space-between;font-size:12.5px"><span>${I("download").replace("<svg","<svg style='width:14px;color:var(--pri)'")} ${t("store_used").replace("{u}",mb(u.used)).replace("{q}",(u.quota/1073741824).toFixed(1))}</span><span class="pill ${pers?"green":"amber"}">${pers?t("store_persist_on"):t("store_persist_off")}</span></div><div class="pwbar" style="--w:${Math.max(1,Math.min(100,u.used/u.quota*100))}%;margin-top:6px" data-s="4"></div>`:"";});
  ACT.setSave=()=>{collect();save();toast(t("set_saved"));render()};
  ACT.setPreview=()=>{collect();const p=S.patients[0];pdfRx(p,{date:todayISO(),rx:S.templates[0]?S.templates[0].rx:[]})};
  ACT.bkExport=()=>openBackupExport();
  $("#bkfile").onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>importBackupText(rd.result);rd.readAsText(file);e.target.value=""};
  ACT.secOn=()=>openEnableEncryption();ACT.secChange=()=>openChangePassword();ACT.secLock=()=>lockNow();
  ACT.secOff=()=>askPassword(t("sec_disable"),t("sec_disable_text"),async pw=>{if(!await verifyPassword(pw))return false;await disableEncryption();toast(t("sec_disabled"));render()});
  $("#alk")&&($("#alk").onchange=e=>{S.settings.autolock=+e.target.value;save()});
  ACT.bkDemo=()=>confirmBox(t("set_reset")+" ?",()=>{S=buildDemo();save();render()});
  ACT.bkWipe=()=>confirmBox(t("wipe_confirm"),()=>{const st=S.settings;S={version:1,settings:st,patients:[],visits:[],meds:S.meds,templates:S.templates,rdv:[],payments:[]};save();render()},{yes:t("set_wipe")});
}

/* resize an uploaded image (logo, stamp) so the data stays small */
function shrinkImage(file,maxW,maxH){
  return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=rej;rd.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const k=Math.min(1,maxW/img.width,maxH/img.height),w=Math.round(img.width*k),h=Math.round(img.height*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
    res(file.type==="image/jpeg"?c.toDataURL("image/jpeg",.88):c.toDataURL("image/png"))};img.src=rd.result};rd.readAsDataURL(file)});
}

function start(){parseHash();render()}
loadPrefs();
document.documentElement.dataset.theme=UI.theme;
(async()=>{
  await storageInit();
  if(await loadData())start();else{UI.locked=true;showUnlock()}
})();
window.addEventListener("hashchange",()=>{if(!S)return;parseHash();if(modalStack.length)while(modalStack.length)closeModal();render();window.scrollTo(0,0)});
setInterval(()=>{if(S&&UI.route[0]==="agenda"&&!modalStack.length&&!VE.open){const nl=$(".nowline");if(nl)render()}},60000);
let _wasMobile=matchMedia("(max-width:820px)").matches;
window.addEventListener("resize",()=>{const now=matchMedia("(max-width:820px)").matches;if(now!==_wasMobile){_wasMobile=now;if(S&&UI.route[0]==="agenda")render()}});
